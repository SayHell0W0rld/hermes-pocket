name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version tag must use the form vMAJOR.MINOR.PATCH, got: $TAG" >&2
            exit 1
          fi
          MAJOR="${TAG%%.*}"; REST="${TAG#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          echo "version_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Set Android version metadata
        shell: python
        run: |
          import re
          from pathlib import Path
          version_name = "${{ steps.ver.outputs.version_name }}"
          version_code = "${{ steps.ver.outputs.version_code }}"
          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")
          text, code_count = re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {version_code}', text, count=1)
          text, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{version_name}"', text, count=1)
          if code_count != 1 or name_count != 1:
            raise SystemExit("Failed to update Android version metadata")
          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Prepare release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are missing; publishing installable debug APK."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/hermes-pocket-release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Run tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "${{ steps.keystore.outputs.signed }}" == "true" ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            APK="app/build/outputs/apk/release/app-release.apk"
            SUFFIX="release"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            APK="app/build/outputs/apk/debug/app-debug.apk"
            SUFFIX="debug"
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Verify APK version
        shell: bash
        run: |
          APK="${{ steps.build.outputs.apk_path }}"
          BADGING="$(${ANDROID_HOME}/build-tools/34.0.0/aapt2 dump badging "$APK" 2>/dev/null || true)"
          EXPECTED="versionName='${{ steps.ver.outputs.version_name }}'"
          if [[ "$BADGING" != *"$EXPECTED"* ]]; then
            echo "$BADGING" | head -20 >&2
            echo "APK versionName does not match tag: expected $EXPECTED" >&2
            exit 1
          fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp "${{ steps.build.outputs.apk_path }}" \
             "dist/HermesPocket-v${{ steps.ver.outputs.version_name }}-${{ steps.build.outputs.suffix }}.apk"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi
          {
            echo "notes<<EOF"
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:'- %s (%h)' "$RANGE" | grep -v -i "chore(release)" || echo "- Initial release"
            else
            echo "- Initial release of Hermes Pocket"
            fi
            echo ""
            echo ""
            echo "## Install"
            echo ""
            echo "1. Download \`HermesPocket-v${{ steps.ver.outputs.version_name }}-${{ steps.build.outputs.suffix }}.apk\` below"
            echo "2. Enable \"Install unknown apps\" for your browser/file manager"
            echo "3. Open the APK and grant notification permission when prompted"
            echo ""
            if [[ "${{ steps.keystore.outputs.signed }}" == "true" ]]; then
              echo "> Signed release build. Requires Android 8.0+ (API 26)."
            else
              echo "> Debug-signed build. Requires Android 8.0+ (API 26)."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hermes Pocket v${{ steps.ver.outputs.version_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: true
          files: dist/HermesPocket-v${{ steps.ver.outputs.version_name }}-${{ steps.build.outputs.suffix }}.apk
