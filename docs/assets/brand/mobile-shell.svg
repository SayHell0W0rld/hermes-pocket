<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Hermes Pocket mobile shell">
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0D0D1A"/>
      <stop offset="1" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFE566"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="28" fill="#FEFCF7"/>
  <g font-family="Segoe UI, sans-serif">
    <rect x="76" y="52" width="300" height="376" rx="34" fill="url(#phone)" stroke="#2A2A45" stroke-width="6"/>
    <text x="226" y="108" text-anchor="middle" fill="#FFF8DC" font-size="22" font-weight="700">Session B</text>
    <rect x="108" y="140" width="236" height="10" rx="5" fill="#2A2A45"/>
    <rect x="108" y="164" width="188" height="10" rx="5" fill="#2A2A45"/>
    <rect x="108" y="188" width="212" height="10" rx="5" fill="#2A2A45"/>
    <rect x="108" y="252" width="236" height="56" rx="14" fill="#22223A" stroke="#FFD700"/>
    <text x="126" y="286" fill="#FFF8DC" font-size="15">Message Hermes…</text>
    <rect x="108" y="336" width="74" height="34" rx="17" fill="#1A1A2E" stroke="#FFD700"/>
    <rect x="190" y="336" width="74" height="34" rx="17" fill="#1A1A2E" stroke="#2A2A45"/>
    <rect x="272" y="336" width="74" height="34" rx="17" fill="#1A1A2E" stroke="#2A2A45"/>
    <text x="145" y="359" text-anchor="middle" fill="#FFD700" font-size="13">A</text>
    <text x="227" y="359" text-anchor="middle" fill="#FFF8DC" font-size="13">B</text>
    <text x="309" y="359" text-anchor="middle" fill="#FFF8DC" font-size="13">+</text>

    <rect x="452" y="70" width="444" height="108" rx="20" fill="#FFF" stroke="#E0D8C8" stroke-width="2"/>
    <text x="484" y="112" fill="#1A1610" font-size="22" font-weight="700">Native tabs, not WebUI overlays</text>
    <text x="484" y="146" fill="#5C5344" font-size="16">Tabs live below the WebView, so no page content is hidden.</text>

    <rect x="452" y="194" width="444" height="108" rx="20" fill="#FFF" stroke="#E0D8C8" stroke-width="2"/>
    <text x="484" y="236" fill="#1A1610" font-size="22" font-weight="700">Hot WebView pool</text>
    <text x="484" y="270" fill="#5C5344" font-size="16">Keep 1–5 recent sessions alive with LRU eviction.</text>

    <rect x="452" y="318" width="444" height="108" rx="20" fill="#FFF" stroke="#E0D8C8" stroke-width="2"/>
    <text x="484" y="360" fill="#1A1610" font-size="22" font-weight="700">Tailscale startup guard</text>
    <text x="484" y="394" fill="#5C5344" font-size="16">Wait for VPN and server readiness before loading.</text>
    <path d="M414 240h26" stroke="url(#gold)" stroke-width="4"/>
    <path d="M570 240h-90M574 292h-88M574 372h-88" stroke="#E0D8C8" stroke-width="3" stroke-dasharray="7 7"/>
  </g>
