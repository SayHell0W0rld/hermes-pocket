      <stop stop-color="#FEFCF7"/>
      <stop offset="1" stop-color="#F2EADB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D4A017"/>
